[Service]
# The tablet user is pulp (1001), not mobian.
User=pulp
Environment=LANG=en_US.UTF-8
# tty1 like GDM: fbcon=vc:2-63 keeps the kernel console off it, and on tty7
# fbcon and phoc both commit at boot (phoc gets EBUSY, the panel stays black).
TTYPath=/dev/tty1
UtmpIdentifier=tty1
ExecStartPost=
ExecStartPost=+chvt 1
