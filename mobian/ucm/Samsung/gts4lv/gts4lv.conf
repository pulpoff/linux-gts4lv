Syntax 3

SectionUseCase."HiFi" {
	File "/Samsung/gts4lv/HiFi.conf"
	Comment "HiFi audio"
}

# Defaults the user may change. The amps run without Samsung's speaker
# protection firmware, so the analog gain (14 = 14.5 dB) stays below Android's 17.
BootSequence [
	cset "name='FL Digital PCM Volume' 817"
	cset "name='FR Digital PCM Volume' 817"
	cset "name='RL Digital PCM Volume' 817"
	cset "name='RR Digital PCM Volume' 817"

	cset "name='Digital RX1 Digital Volume' 84"
	cset "name='Digital RX2 Digital Volume' 84"

	cset "name='Analog ADC1 Volume' 6"
	cset "name='Analog ADC2 Volume' 6"
	cset "name='Analog ADC3 Volume' 6"
]

FixedBootSequence [
	cset "name='FL Analog PCM Volume' 14"
	cset "name='FR Analog PCM Volume' 14"
	cset "name='RL Analog PCM Volume' 14"
	cset "name='RR Analog PCM Volume' 14"
	cset "name='FL PCM Source' ASP"
	cset "name='FR PCM Source' ASP"
	cset "name='RL PCM Source' ASP"
	cset "name='RR PCM Source' ASP"

	cset "name='Analog RDAC2 MUX' RX2"
	cset "name='Digital CIC1 MUX' AMIC"
	cset "name='Digital CIC2 MUX' AMIC"
]
