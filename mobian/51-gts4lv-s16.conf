# The q6asm playback path stays silent with S24_LE, which PipeWire picks
# by default; 16-bit plays. Pin this card's outputs to S16LE.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
