# /etc/systemd/system/plymouth-quit.service.d/gdm-owns-quit.conf
# multi-user.target pulls plymouth-quit in, and it stopped the splash the moment GDM started (12.5 s),
# 5 s before GNOME Shell takes the display — that gap was a black screen. GDM quits Plymouth itself
# (with --retain-splash) once the session's display server is up, so leave it to GDM. If GDM fails,
# its OnFailure= starts this unit again and the condition then lets it run.
[Unit]
After=gdm.service

[Service]
ExecCondition=/bin/sh -c '! systemctl is-active -q gdm.service'
