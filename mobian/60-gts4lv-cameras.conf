# Galaxy Tab S5e: hide the raw CAMSS V4L2 nodes (libcamera drives them; as plain V4L2 devices they
# only add a dozen unusable "Qualcomm Camera Subsystem" entries an app can pick by mistake) and the
# Venus codec's m2m nodes, which are not cameras either.
# Install: /etc/wireplumber/wireplumber.conf.d/60-gts4lv-cameras.conf, then restart wireplumber.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "v4l2_device.platform-acb3000.isp" }
      { device.name = "v4l2_device.platform-aa00000.video-codec" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
